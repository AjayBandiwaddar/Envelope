<svg viewBox="0 0 1200 1150" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475467"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1200" height="1150" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#1c2530">Agentic Commerce Architecture</text>
  <text x="600" y="65" text-anchor="middle" font-size="13.5" fill="#667085">AI decides what to buy. The firewall decides what it's allowed to do. Razorpay decides the outcome. The audit trail records everything.</text>

  <!-- USER -->
  <rect x="385" y="95" width="430" height="55" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="600" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">USER — natural-language request</text>
  <line x1="600" y1="150" x2="600" y2="180" stroke="#475467" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- SYSTEM 3: AI Buyer Agent -->
  <rect x="270" y="185" width="660" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="600" y="213" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">AI Buyer Agent</text>
  <text x="600" y="235" text-anchor="middle" font-size="12" fill="#1e3a8a">Google Gemini as a real MCP client — reasons over the live catalog, proposes a product</text>
  <text x="600" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Cannot confirm its own purchase — that ability is structurally not given to it</text>
  <line x1="600" y1="280" x2="600" y2="310" stroke="#475467" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- SYSTEM 2: Reference Merchant -->
  <rect x="270" y="315" width="660" height="95" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="600" y="343" text-anchor="middle" font-size="14.5" font-weight="800" fill="#166534">Reference Merchant</text>
  <text x="600" y="365" text-anchor="middle" font-size="12" fill="#166534">Real MCP server — list_products, propose_purchase_intent · schema.org product data</text>
  <text x="600" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Prices are canonical and server-derived — never supplied by the agent</text>
  <line x1="600" y1="410" x2="600" y2="440" stroke="#475467" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- PurchaseIntent -->
  <rect x="345" y="445" width="510" height="55" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="600" y="478" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">PurchaseIntent — price locked in from the database, right now</text>
  <line x1="600" y1="500" x2="600" y2="530" stroke="#475467" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Authorization split -->
  <text x="600" y="545" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">AUTHORIZATION — never decided by the model</text>

  <rect x="270" y="560" width="310" height="95" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="425" y="588" text-anchor="middle" font-size="13.5" font-weight="800" fill="#166534">SpendingEnvelope</text>
  <text x="425" y="608" text-anchor="middle" font-size="11" fill="#166534">Auto-confirms if a pre-authorized</text>
  <text x="425" y="623" text-anchor="middle" font-size="11" fill="#166534">balance covers it — atomic, agent+merchant scoped</text>
  <text x="425" y="641" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3f7a4f">agent can never create or edit this</text>

  <rect x="620" y="560" width="310" height="95" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="775" y="588" text-anchor="middle" font-size="13.5" font-weight="800" fill="#991b1b">Human Confirmation</text>
  <text x="775" y="608" text-anchor="middle" font-size="11" fill="#991b1b">Used when the envelope</text>
  <text x="775" y="623" text-anchor="middle" font-size="11" fill="#991b1b">doesn't cover the purchase</text>
  <text x="775" y="641" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">not an MCP tool — agent structurally cannot call this</text>

  <line x1="600" y1="530" x2="425" y2="560" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="600" y1="530" x2="775" y2="560" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="425" y1="655" x2="500" y2="695" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="775" y1="655" x2="700" y2="695" stroke="#475467" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- SYSTEM 1: Firewall -->
  <rect x="270" y="700" width="660" height="180" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="600" y="728" text-anchor="middle" font-size="14.5" font-weight="800" fill="#6b21a8">Agent Action Firewall — two independent locks</text>

  <rect x="292" y="745" width="290" height="115" rx="10" fill="white" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="437" y="770" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Policy Engine</text>
  <text x="437" y="792" text-anchor="middle" font-size="10.5" fill="#5b21b6">Deterministic ALLOW/DENY</text>
  <text x="437" y="808" text-anchor="middle" font-size="10.5" fill="#5b21b6">No implicit allow, anywhere</text>
  <text x="437" y="824" text-anchor="middle" font-size="10.5" fill="#5b21b6">Confused-deputy protection</text>
  <text x="437" y="843" text-anchor="middle" font-size="9.5" fill="#7c3aed">per agent · tool · resource</text>

  <rect x="618" y="745" width="290" height="115" rx="10" fill="white" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="763" y="770" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Cryptographic Mandate</text>
  <text x="763" y="792" text-anchor="middle" font-size="10.5" fill="#5b21b6">Ed25519-signed proof of</text>
  <text x="763" y="808" text-anchor="middle" font-size="10.5" fill="#5b21b6">exactly what was authorized</text>
  <text x="763" y="824" text-anchor="middle" font-size="10.5" fill="#5b21b6">(simplified AP2 Cart Mandate analogue)</text>
  <text x="763" y="843" text-anchor="middle" font-size="9.5" fill="#7c3aed">re-verified fresh, every time</text>

  <!-- DENY box -->
  <rect x="985" y="740" width="200" height="145" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1085" y="765" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">DENY paths</text>
  <text x="1085" y="787" text-anchor="middle" font-size="10" fill="#b91c1c">Skip confirmation →</text>
  <text x="1085" y="801" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">POLICY_NOT_FOUND</text>
  <text x="1085" y="820" text-anchor="middle" font-size="10" fill="#b91c1c">Unknown parameter →</text>
  <text x="1085" y="834" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">UNKNOWN_PARAMETER</text>
  <text x="1085" y="853" text-anchor="middle" font-size="10" fill="#b91c1c">Tampered mandate →</text>
  <text x="1085" y="867" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">ALLOW, but blocked anyway</text>

  <line x1="930" y1="812" x2="985" y2="812" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>

  <line x1="600" y1="880" x2="600" y2="910" stroke="#475467" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Razorpay -->
  <rect x="345" y="915" width="510" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="600" y="943" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">Razorpay Test Mode — real Orders API, real Checkout</text>
  <text x="600" y="962" text-anchor="middle" font-size="11" fill="#1e3a8a">signature verified before payment is ever finalized</text>
  <line x1="600" y1="975" x2="600" y2="1005" stroke="#475467" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Audit -->
  <rect x="345" y="1010" width="510" height="60" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="600" y="1038" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Audit Trail — every decision, ALLOW or DENY, permanently recorded</text>
  <text x="600" y="1057" text-anchor="middle" font-size="11" fill="#475569">re-verified live, on every page load — not a cached claim</text>

  <text x="600" y="1105" text-anchor="middle" font-size="11.5" fill="#98a2b3">Live at /agent-console/ · /security-demo/ · /concurrency-demo/ · /checkout/&lt;id&gt;/audit/</text>
</svg>
