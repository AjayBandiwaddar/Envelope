<!DOCTYPE html>
<html>
<head>
  <title>Concurrency Demo - Reference Merchant</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 60px auto; }
    .attempt-row { padding: 14px; margin: 8px 0; border-radius: 6px; border: 2px solid #ddd; font-size: 16px; }
    .PENDING { border-color: #ccc; color: #888; }
    .HELD { border-color: #16a34a; background: #f0fdf4; color: #166534; font-weight: bold; }
    .DENIED { border-color: #dc2626; background: #fef2f2; color: #991b1b; font-weight: bold; }
    #run-btn { padding: 12px 24px; font-size: 16px; }
    #summary { margin-top: 24px; padding: 16px; background: #eff6ff; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <h1>Concurrency Demo</h1>
  <p>
    3 purchase attempts fire at the exact same instant against one
    SpendingEnvelope with balance for only ONE of them. The database's
    atomic conditional update - not application-level locking - decides
    which one wins. Nothing here is scripted or pre-determined.
  </p>
  <button id="run-btn">Run Concurrency Race</button>
  <div id="attempts"></div>
  <div id="summary"></div>

  <script>
    document.getElementById('run-btn').onclick = async function () {
      this.disabled = true;
      document.getElementById('attempts').innerHTML = '';
      document.getElementById('summary').style.display = 'none';

      const startResp = await fetch('/concurrency-demo/start/', { method: 'POST' });
      const { race_id } = await startResp.json();

      const poll = setInterval(async () => {
        const statusResp = await fetch(`/concurrency-demo/status/${race_id}/`);
        const status = await statusResp.json();

        const container = document.getElementById('attempts');
        container.innerHTML = '';
        Object.entries(status.attempts).forEach(([i, a]) => {
          const row = document.createElement('div');
          row.className = `attempt-row ${a.status}`;
          row.textContent = `Attempt ${parseInt(i) + 1}: ${a.status}` + (a.reason ? ` (${a.reason})` : '');
          container.appendChild(row);
        });

        if (status.done) {
          clearInterval(poll);
          document.getElementById('run-btn').disabled = false;
          const summary = document.getElementById('summary');
          summary.style.display = 'block';
          summary.innerHTML = `<strong>Final envelope balance: ₹${(status.final_remaining / 100).toFixed(2)} / ₹${(status.max_balance / 100).toFixed(2)}</strong><br>Exactly one attempt was held; the rest were correctly denied by the database's own atomic guarantee - never overdrawn, under real concurrent access.`;
        }
      }, 300);
    };
  </script>
</body>
</html>
